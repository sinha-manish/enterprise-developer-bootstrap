name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  analyze-and-test:
    name: PSScriptAnalyzer and Pester
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -SkipPublisherCheck
          Install-Module -Name powershell-yaml -MinimumVersion 0.4.7 -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = @{
            Severity     = @('Error', 'Warning')
            ExcludeRules = @('PSUseShouldProcessForStateChangingFunctions')
          }
          $results = Invoke-ScriptAnalyzer -Path ./modules -Recurse -Settings $settings
          $results += Invoke-ScriptAnalyzer -Path ./bootstrap -Recurse -Settings $settings
          $results += Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings $settings -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object Severity -eq 'Error'
            if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
          }
          Write-Host "PSScriptAnalyzer passed."

      - name: Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = @('Integration')
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'PesterResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: PesterResults.xml
